name: czn-data

on:
  push:
    branches: [main]
    paths:
      - projects/czn-data/**
      - .github/workflows/czn-data.yml
  pull_request:
    paths:
      - projects/czn-data/**
      - .github/workflows/czn-data.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/czn-data

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          working_directory: projects/czn-data
      - run: uv sync --locked
      - run: mise run lint
      # Builds and starts the Postgres image with pg_textsearch (postgres/Dockerfile).
      - run: mise run test -rs

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/czn-data
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v7
        with:
          context: projects/czn-data
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # pg_textsearch's files, which the cluster's Postgres mounts as an image volume.
      - id: extension
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/czn-data-pg-textsearch
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v7
        with:
          context: projects/czn-data/postgres
          target: extension
          push: true
          tags: ${{ steps.extension.outputs.tags }}
          labels: ${{ steps.extension.outputs.labels }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
