name: markdown

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - .markdownlint-cli2.yaml
      - mise.toml
      - .github/workflows/markdown.yml
  pull_request:
    paths:
      - '**.md'
      - .markdownlint-cli2.yaml
      - mise.toml
      - .github/workflows/markdown.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run lint
