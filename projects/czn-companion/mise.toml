[tools]
java = "temurin-25"
android-sdk = "23.0"
android-cli = "1.1.16919734"

[tasks.setup]
description = "Install the Android SDK packages the build needs"
run = "android --no-metrics sdk install platform-tools platforms/android-37.2 build-tools/36.0.0"

[tasks.check]
description = "Format check, lint, and unit tests"
run = "./gradlew spotlessCheck lint testDebugUnitTest"

[tasks.format]
description = "Apply formatting"
run = "./gradlew spotlessApply"

[tasks.build]
description = "Build the debug APK"
run = "./gradlew assembleDebug"

[tasks.install]
description = "Install the debug APK on every attached device (or ANDROID_SERIAL) and launch it"
run = '''
#!/usr/bin/env bash
set -euo pipefail
./gradlew installDebug
if [[ -n ${ANDROID_SERIAL:-} ]]; then
  serials=("$ANDROID_SERIAL")
else
  mapfile -t serials < <(adb devices | awk 'NR > 1 && $2 == "device" { print $1 }')
fi
service=app.dailey.czn.companion/app.dailey.czn.companion.overlay.OverlayService
for serial in "${serials[@]}"; do
  adb -s "$serial" shell am start -n app.dailey.czn.companion/.MainActivity
  # A reinstall leaves the overlay service enabled but unbound; toggling rebinds it. Lenovo ZUI
  # refuses to start the app's process for a background bind, so the activity starts first.
  sleep 3
  enabled=$(adb -s "$serial" shell settings get secure enabled_accessibility_services | tr -d '\r')
  if [[ $enabled == *"$service"* ]]; then
    others=$(tr ':' '\n' <<<"$enabled" | awk -v s="$service" '$0 != s' | paste -sd:)
    # "" reaches the device shell as an empty value.
    adb -s "$serial" shell settings put secure enabled_accessibility_services "${others:-\"\"}"
    sleep 1
    adb -s "$serial" shell settings put secure enabled_accessibility_services \
      "${others:+$others:}$service"
    adb -s "$serial" shell settings put secure accessibility_enabled 1
  fi
done
'''

[tasks.preview]
description = "Render every @Preview to PNGs under build/previews"
run = '''
#!/usr/bin/env bash
set -euo pipefail
target="gradle://.?:app@debug"
args=()
while read -r line; do
  [[ $line =~ ^[a-z][A-Za-z0-9_.]+$ ]] && args+=("--fqn=$line")
done < <(android --no-metrics preview list "$target")
android --no-metrics preview render --output=build/previews "${args[@]}" "$target"
'''
