[tools]
uv = "0.13.8"

[env]
# Local development database started by `mise run db`.
DATABASE_URL = "postgresql://postgres:dev@localhost:55432/postgres"

[tasks.db]
description = "Start the local development Postgres (data persists in the czn-data-dev volume)"
run = """
#!/usr/bin/env bash
set -euo pipefail
name=czn-data-dev-pg
if ! docker container inspect "$name" >/dev/null 2>&1; then
  docker run -d --name "$name" --restart unless-stopped -e POSTGRES_PASSWORD=dev \
    -p 55432:5432 -v czn-data-dev:/var/lib/postgresql postgres:18 >/dev/null
fi
docker start "$name" >/dev/null
until docker exec "$name" pg_isready -q -h 127.0.0.1 -U postgres; do sleep 0.5; done
"""

[tasks.lint]
run = ["uv run ruff check", "uv run ruff format --check"]

[tasks.test]
description = "Run tests against a throwaway Postgres container"
run = """
#!/usr/bin/env bash
set -euo pipefail
name=czn-data-test-pg
docker run -d --rm --name "$name" -e POSTGRES_PASSWORD=test -p 55433:5432 postgres:18 >/dev/null
trap 'docker stop "$name" >/dev/null' EXIT
# TCP, not the socket: during initdb the server accepts only socket connections.
until docker exec "$name" pg_isready -q -h 127.0.0.1 -U postgres; do sleep 0.5; done
TEST_DATABASE_URL=postgresql://postgres:test@localhost:55433/postgres uv run pytest "$@"
"""
