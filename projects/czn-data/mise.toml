[tools]
uv = "0.13.8"

[env]
# Local development database started by `mise run db`.
DATABASE_URL = "postgresql://postgres:dev@localhost:55432/postgres"
# Where the portrait tagger downloads its model on first use.
CZN_TAGGER_DIR = "{{env.HOME}}/.cache/czn-data/wd-tagger"
# Where the screenshot identity models are downloaded on first use (about 250 MB).
CZN_IDENTITY_DIR = "{{env.HOME}}/.cache/czn-data/identity"
# Where fastembed keeps the search embedding model (67 MB, downloaded on first use).
FASTEMBED_CACHE_PATH = "{{env.HOME}}/.cache/czn-data/fastembed"

[tasks.db]
description = "Start the local development Postgres (data persists in the czn-data-dev volume)"
run = "docker compose up -d --wait"

[tasks.lint]
run = ["uv run ruff check", "uv run ruff format --check"]

[tasks.format]
description = "Apply lint fixes, then format; the given files, or the whole project"
run = '''
#!/usr/bin/env bash
uv run ruff check --fix --exit-zero --silent "$@"
uv run ruff format --quiet "$@"
'''

[tasks.test]
description = "Run tests against a throwaway Postgres container"
run = """
#!/usr/bin/env bash
set -euo pipefail
pg=czn-data-test-pg
docker run -d --rm --name "$pg" -e POSTGRES_PASSWORD=test -p 55433:5432 postgres:18 >/dev/null
trap 'docker stop "$pg" >/dev/null 2>&1' EXIT
# TCP, not the socket: during initdb the server accepts only socket connections.
until docker exec "$pg" pg_isready -q -h 127.0.0.1 -U postgres; do sleep 0.5; done
TEST_DATABASE_URL=postgresql://postgres:test@localhost:55433/postgres uv run pytest "$@"
"""
