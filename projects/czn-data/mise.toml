[tools]
uv = "0.13.8"

[env]
# Local development database started by `mise run db`.
DATABASE_URL = "postgresql://postgres:dev@localhost:55432/postgres"
# Where the portrait tagger downloads its model on first use.
CZN_TAGGER_DIR = "{{env.HOME}}/.cache/czn-data/wd-tagger"

[tasks.db]
description = "Start the local development Postgres (data persists in the czn-data-dev volume)"
run = "docker compose up -d --wait"

[tasks.lint]
run = ["uv run ruff check", "uv run ruff format --check"]

[tasks.test]
description = "Run tests against throwaway Postgres and VictoriaMetrics containers"
run = """
#!/usr/bin/env bash
set -euo pipefail
pg=czn-data-test-pg vm=czn-data-test-vm
docker run -d --rm --name "$pg" -e POSTGRES_PASSWORD=test -p 55433:5432 postgres:18 >/dev/null
trap 'docker stop "$pg" "$vm" >/dev/null 2>&1' EXIT
# Same OTLP naming flag as the cluster; no latency offset so tests see samples at once.
docker run -d --rm --name "$vm" -p 58428:8428 victoriametrics/victoria-metrics:latest \
  -opentelemetry.usePrometheusNaming -search.latencyOffset=0s >/dev/null
# TCP, not the socket: during initdb the server accepts only socket connections.
until docker exec "$pg" pg_isready -q -h 127.0.0.1 -U postgres; do sleep 0.5; done
until curl -sf localhost:58428/health >/dev/null; do sleep 0.5; done
TEST_DATABASE_URL=postgresql://postgres:test@localhost:55433/postgres \
  TEST_VM_URL=http://localhost:58428 uv run pytest "$@"
"""
