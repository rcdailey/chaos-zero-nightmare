[project]
name = "czn-data"
version = "0.1.0"
description = "Scrapes Chaos Zero Nightmare data from prydwen.gg and serves it over MCP"
readme = "README.md"
authors = [
    { name = "Robert Dailey", email = "git@rdailey.me" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15",
    "cryptography>=50",
    "curl-cffi>=0.17",
    "fastembed>=0.9.1",
    "lxml>=6.1",
    "mcp>=2.3",
    "numpy>=2.5.4",
    "onnxruntime>=1.32.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3",
    "pyjwt[crypto]>=2.15",
    "python-dateutil>=2.9",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
czn-data = "czn_data.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pyyaml>=6.0.3",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
