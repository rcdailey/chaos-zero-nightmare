# Questions with the passages that answer them, for `czn-data eval-search`, which reports how
# many find an answer in the top 5 (recall@5) and how high the first one ranks (MRR).
#
# Questions come from players (the companion app's runs and Discord) and from the queries Claude
# wrote for them. Each expect entry names a passage that answers the question: its source
# (passage.source) and words its title holds, plus words its heading holds when the page has
# other sections. Any one expected passage in the top 5 counts as found. Add a case whenever a
# player question went unanswered.

[[case]]
tool = "search_game_systems"
query = "Save Data start a Chaos run with saved data"
expect = [
    { source = "help", title = "Save Rules for Faint Memories" },
    { source = "help", title = "Build Preset" },
]

[[case]]
tool = "search_game_systems"
query = "When I start a Chaos run, can I start from an existing Save Data and edit it, or do I start fresh every time?"
expect = [
    { source = "help", title = "Save Rules for Faint Memories" },
    { source = "help", title = "Build Preset" },
]

